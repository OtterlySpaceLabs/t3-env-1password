name: Release

on:
    push:
        branches: [main, beta]

permissions:
    contents: read

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    ci:
        uses: ./.github/workflows/ci.yml

    release:
        needs: ci
        runs-on: ubuntu-latest
        permissions:
            contents: write # create tags, GitHub releases and the release commit
            issues: write # comment on released issues
            pull-requests: write # comment on released pull requests
            id-token: write # npm trusted publishing (OIDC) and provenance
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            # Provides npm >= 11.5, required for trusted publishing.
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
            - uses: pnpm/setup@v3
              with:
                  node-version-file: false
                  require-lockfile: true
            - run: pnpm run build
            - run: pnpm exec semantic-release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # Only needed for the very first publish, before trusted publishing is configured on npmjs.com.
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
